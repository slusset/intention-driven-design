id: account
type: model
entity: Account
aggregate: AccountAggregate
sources:
  stories:
    - specs/stories/mobile-signup.story.md
    - specs/stories/quick-start-audit.story.md
  journeys:
    - specs/journeys/trade-show-signup.journey.md
fields:
  accountId:
    type: string
    constraints:
      - non-empty
      - immutable
  email:
    type: string
    constraints:
      - valid-email-format
      - unique
  status:
    type: string
    values:
      - pending
      - active
rules:
  - id: account-activates-on-signup
    when: signup-submitted
    then: status=active
