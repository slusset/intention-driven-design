name: Release Please
run-name: Release Please (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the release PR or publish a merged release PR
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - publish

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Release Please must be dispatched from main."
          exit 1

      - name: Prepare or publish the release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.operation == 'prepare' }}
          skip-github-pull-request: ${{ inputs.operation == 'publish' }}

      - name: Check out the released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Set up Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify the released source
        if: ${{ steps.release.outputs.release_created }}
        run: |
          npm ci
          npm test
          node bin/idd.js validate all
          node tools/validate-plugin-manifests.js

      - name: Build the toolkit release artifact
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          # Checksums let the standalone installer (install/idd-install.sh)
          # verify the tarball it downloads.
          (cd dist && sha256sum *.tgz > SHA256SUMS)

      - name: Attach the toolkit artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/*.tgz dist/SHA256SUMS install/idd-install.sh

      - name: Move the supported major action tag
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.major != '0' && !contains(steps.release.outputs.version, '-') }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa "v${MAJOR}" -m "Release v${MAJOR}"
          git push origin "refs/tags/v${MAJOR}" --force
