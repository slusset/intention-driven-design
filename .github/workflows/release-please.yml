name: Release Please
run-name: Release Please (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the release PR or publish a merged release PR
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - publish

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Release Please must be dispatched from main."
          exit 1

      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js for the release gate
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Gate both prepare and publish: the post-release verification below runs
      # after the tag exists, which is too late to stop a bad release.
      - name: Gate the release on a clean repository
        run: |
          npm ci
          npm test
          node bin/idd.js validate all
          node tools/validate-plugin-manifests.js
          node tools/build-dist.js --check
          node tools/sync-skill-references.js --check

      # Packed before the release exists, so the only step left after creation
      # is the upload. A release page that is visible without its tarball is
      # what a consumer's installer hits as a 404.
      - name: Build the toolkit release artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          # Checksums let the standalone installer (install/idd-install.sh)
          # verify the tarball it downloads.
          (cd dist && sha256sum *.tgz > SHA256SUMS)

      - name: Prepare or publish the release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.operation == 'prepare' }}
          skip-github-pull-request: ${{ inputs.operation == 'publish' }}

      # The gate above ran the suite, the validators and the manifest checks on
      # this exact commit, and the tag points at it, so re-verifying the tag
      # here would only delay the upload.
      - name: Attach the toolkit artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ steps.release.outputs.tag_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Released tag $TAG does not match the packed version $VERSION."
            exit 1
          fi
          gh release upload "$TAG" "dist/idd-toolkit-$VERSION.tgz" dist/SHA256SUMS install/idd-install.sh

      - name: Move the supported major action tag
        if: ${{ steps.release.outputs.release_created && steps.release.outputs.major != '0' && !contains(steps.release.outputs.version, '-') }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -fa "v${MAJOR}" -m "Release v${MAJOR}"
          git push origin "refs/tags/v${MAJOR}" --force
