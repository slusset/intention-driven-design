name: Specs Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - '.github/workflows/specs-validation.yml'
  pull_request:
    paths:
      - 'specs/**'

jobs:
  validate-openapi:
    name: Validate OpenAPI Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: |
          if [ -f specs/contracts/openapi/api.yaml ]; then
            spectral lint specs/contracts/openapi/api.yaml --ruleset .spectral.yaml
          else
            echo "OpenAPI spec not found, skipping validation"
          fi

  validate-fixtures:
    name: Validate Fixtures Match Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml ajv ajv-formats

      - name: Validate fixtures
        run: |
          if [ -d specs/fixtures ] && [ -f specs/contracts/openapi/api.yaml ]; then
            node tools/validate-fixtures.js
          else
            echo "Fixtures or OpenAPI spec not found, skipping validation"
          fi

  validate-features:
    name: Validate Gherkin Feature Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gherkin linter
        run: npm install -g gherkin-lint

      - name: Lint feature files
        run: |
          if [ -d specs/features ]; then
            gherkin-lint specs/features/**/*.feature || true
          else
            echo "Feature files not found, skipping validation"
          fi

  validate-journey-maps:
    name: Validate Journey Maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Validate journey map schema
        run: |
          if [ -d specs/journey-maps ]; then
            node tools/validate-journey-maps.js
          else
            echo "Journey maps not found, skipping validation"
          fi

  validate-models:
    name: Validate Domain Models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Validate model schema
        run: |
          if [ -d specs/models ]; then
            node tools/validate-models.js
          else
            echo "Models not found, skipping validation"
          fi

  traceability-check:
    name: Check Traceability Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Check references exist
        run: |
          node tools/check-traceability.js || echo "Traceability check had warnings"
