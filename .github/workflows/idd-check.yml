name: IDD Compliance (example specs)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'tools/**/*.js'
      - 'bin/**'
      - 'skills/**'
      - 'technical-skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/idd-check.yml'
      - '.github/actions/idd-check/**'
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'tools/**/*.js'
      - 'bin/**'
      - 'skills/**'
      - 'technical-skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/idd-check.yml'
      - '.github/actions/idd-check/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate example specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run IDD checks
        uses: ./.github/actions/idd-check
        with:
          checks: all
          spectral-ruleset: .spectral.yaml
          gherkin-config: .gherkin-lintrc

  validate-plugin:
    name: Validate plugin manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Codex/ChatGPT plugin manifest and bundled tooling
        run: node tools/validate-plugin-manifests.js

      # Validating a bare skills directory behaves differently across CLI
      # versions (components mode vs. plugin-root mode), so Claude CI sticks
      # to the legacy manifests; the repository check above validates the
      # Codex manifest and its core-only skills root.
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
