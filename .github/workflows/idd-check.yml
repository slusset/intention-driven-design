name: IDD Compliance (example specs)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'certification/**'
      - 'tools/**/*.js'
      - 'bin/**'
      - '.github/workflows/idd-check.yml'
      - '.github/actions/idd-check/**'
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'certification/**'
      - 'tools/**/*.js'
      - 'bin/**'
      - '.github/workflows/idd-check.yml'
      - '.github/actions/idd-check/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate example specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run IDD checks
        uses: ./.github/actions/idd-check
        with:
          checks: all
          spectral-ruleset: .spectral.yaml
          gherkin-config: .gherkin-lintrc
