name: IDD Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'tools/validate-*.js'
      - 'tools/check-*.js'
      - 'tools/lib/**'
      - '.github/workflows/idd-check.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'tools/validate-*.js'
      - 'tools/check-*.js'
      - 'tools/lib/**'
      - '.github/workflows/idd-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validator dependencies
        run: npm ci --prefix tools

      - name: Determine validation mode
        id: mode
        run: |
          MODE="full"
          CHANGED_FILES=()

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="diff"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'specs/')
          fi

          CHANGED_COUNT=${#CHANGED_FILES[@]}

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "changed_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run validator suite
        id: validators
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGED_COUNT: ${{ steps.mode.outputs.changed_count }}
          CHANGED_FILES: ${{ steps.mode.outputs.changed_files }}
        run: |
          SUMMARY_FILE="/tmp/idd-validator-summary.json"
          echo '[]' > "$SUMMARY_FILE"
          HAS_FAILURES="false"

          if [ "$MODE" = "diff" ] && [ "$CHANGED_COUNT" = "0" ]; then
            echo "No changed spec files in PR diff. Skipping validators."
          else
            mapfile -t CHANGED < <(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d')

            for ENTRY in \
              "traceability|Traceability|tools/validate-traceability.js" \
              "front_matter|Front-Matter|tools/validate-front-matter.js" \
              "capability_scope|Capability Scope|tools/validate-capability-scope.js" \
              "fixtures|Fixture Schemas|tools/validate-fixtures.js" \
              "models|Model Structure|tools/validate-models.js" \
              "journey_maps|Journey Map Structure|tools/validate-journey-maps.js"
            do
              IFS='|' read -r KEY LABEL SCRIPT <<< "$ENTRY"

              RAW_FILE="/tmp/${KEY}.raw.txt"
              JSON_FILE="/tmp/${KEY}.json"

              CMD=(node "$SCRIPT" specs --json)
              if [ "$MODE" = "diff" ] && [ "${#CHANGED[@]}" -gt 0 ]; then
                CMD+=(--files "${CHANGED[@]}")
              fi

              set +e
              OUTPUT="$("${CMD[@]}" 2>&1)"
              EXIT_CODE=$?
              set -e

              printf '%s\n' "$OUTPUT" > "$RAW_FILE"

              node -e "const fs=require('fs');const raw=fs.readFileSync(process.argv[2],'utf8').trim();let payload;try{payload=JSON.parse(raw);}catch{payload={errors:['Validator did not return JSON output'],warnings:[],info:[raw||'(no output)']};}for(const key of ['errors','warnings','info']){if(!Array.isArray(payload[key]))payload[key]=[];}fs.writeFileSync(process.argv[1],JSON.stringify(payload,null,2));" "$JSON_FILE" "$RAW_FILE"

              ERRORS=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String((d.errors||[]).length));" "$JSON_FILE")
              WARNINGS=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String((d.warnings||[]).length));" "$JSON_FILE")

              if [ "$EXIT_CODE" -ne 0 ] || [ "$ERRORS" -gt 0 ]; then
                HAS_FAILURES="true"
              fi

              node -e "const fs=require('fs');const [summaryFile,key,label,exitCode,errors,warnings,jsonPath]=process.argv.slice(1);const summary=JSON.parse(fs.readFileSync(summaryFile,'utf8'));const details=JSON.parse(fs.readFileSync(jsonPath,'utf8'));summary.push({key,label,exitCode:Number(exitCode),errors:Number(errors),warnings:Number(warnings),info:Array.isArray(details.info)?details.info.length:0,jsonPath});fs.writeFileSync(summaryFile,JSON.stringify(summary,null,2));" "$SUMMARY_FILE" "$KEY" "$LABEL" "$EXIT_CODE" "$ERRORS" "$WARNINGS" "$JSON_FILE"

            done
          fi

          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"
          echo "has_failures=$HAS_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Check spec-before-code
        id: specbeforecode
        if: github.event_name == 'pull_request'
        run: |
          set +e
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

          IMPL_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'backend/src/' 'frontend/src/' | wc -l | tr -d ' ')
          SPEC_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'specs/' | wc -l | tr -d ' ')

          echo "impl_changes=$IMPL_CHANGES" >> "$GITHUB_OUTPUT"
          echo "spec_changes=$SPEC_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$IMPL_CHANGES" -gt "0" ] && [ "$SPEC_CHANGES" -eq "0" ]; then
            echo "warning=true" >> "$GITHUB_OUTPUT"
          else
            echo "warning=false" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Post aggregated PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ steps.validators.outputs.summary_file }}
          MODE: ${{ steps.mode.outputs.mode }}
          CHANGED_COUNT: ${{ steps.mode.outputs.changed_count }}
          SPEC_WARNING: ${{ steps.specbeforecode.outputs.warning }}
          IMPL_CHANGES: ${{ steps.specbeforecode.outputs.impl_changes }}
          SPEC_CHANGES: ${{ steps.specbeforecode.outputs.spec_changes }}
        with:
          script: |
            const fs = require('fs');

            const marker = '## IDD Validation Report';
            const summaryFile = process.env.SUMMARY_FILE;
            const mode = process.env.MODE;
            const changedCount = Number(process.env.CHANGED_COUNT || '0');
            const specWarning = process.env.SPEC_WARNING === 'true';
            const implChanges = Number(process.env.IMPL_CHANGES || '0');
            const specChanges = Number(process.env.SPEC_CHANGES || '0');

            let summary = [];
            if (summaryFile && fs.existsSync(summaryFile)) {
              summary = JSON.parse(fs.readFileSync(summaryFile, 'utf8'));
            }

            let body = `${marker}\n\n`;
            body += `- Mode: ${mode === 'diff' ? 'PR diff' : 'Full scan'}\n`;

            if (mode === 'diff') {
              body += `- Changed spec files: ${changedCount}\n`;
            }

            body += '\n';

            if (mode === 'diff' && changedCount === 0) {
              body += 'No `specs/**` files changed in this PR diff, so validator execution was skipped.\n\n';
            }

            for (const entry of summary) {
              const details = JSON.parse(fs.readFileSync(entry.jsonPath, 'utf8'));
              const errors = details.errors || [];
              const warnings = details.warnings || [];
              const info = details.info || [];

              const icon = errors.length > 0 || entry.exitCode !== 0
                ? '❌'
                : warnings.length > 0
                  ? '⚠️'
                  : '✅';

              body += `### ${entry.label} ${icon}\n`;
              body += `- ${errors.length} error(s), ${warnings.length} warning(s)\n`;

              const lines = [
                ...errors.map((value) => `ERROR: ${value}`),
                ...warnings.map((value) => `WARN: ${value}`),
                ...info.map((value) => `INFO: ${value}`),
              ];

              if (lines.length > 0) {
                const preview = lines.slice(0, 25).join('\n');
                const remaining = lines.length - 25;
                body += '\n<details><summary>Details</summary>\n\n```\n';
                body += preview;
                if (remaining > 0) {
                  body += `\n... and ${remaining} more line(s)`;
                }
                body += '\n```\n</details>\n';
              }

              body += '\n';
            }

            if (implChanges > 0) {
              if (specWarning) {
                body += '### Spec-Before-Code ⚠️\n';
                body += `- ${implChanges} implementation file(s) changed without spec updates\n\n`;
              } else {
                body += '### Spec-Before-Code ✅\n';
                body += `- ${implChanges} implementation file(s) with ${specChanges} spec file(s) updated\n\n`;
              }
            }

            body += '---\n';
            body += '*Automated by IDD validation workflow*\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job on validation errors
        if: steps.validators.outputs.has_failures == 'true'
        run: |
          echo "IDD validation failed. See aggregated validator results above."
          exit 1
