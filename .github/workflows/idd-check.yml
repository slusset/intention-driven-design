name: IDD Compliance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'certification/**'
      - 'tools/**/*.js'
      - '.github/workflows/idd-check.yml'
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'certification/**'
      - 'tools/**/*.js'
      - '.github/workflows/idd-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: IDD Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tool dependencies
        run: |
          cd tools
          npm ci
          cd ..
          npm install -g @stoplight/spectral-cli gherkin-lint

      - name: Gather changed specs
        id: changed_specs
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'specs/**' > /tmp/changed-specs.txt
            COUNT=$(grep -c . /tmp/changed-specs.txt || true)
          else
            : > /tmp/changed-specs.txt
            COUNT=0
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Run traceability validator
        id: traceability
        continue-on-error: true
        run: |
          set +e
          node tools/validate-traceability.js --json > /tmp/traceability.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/traceability.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run front-matter validator
        id: frontmatter
        continue-on-error: true
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changed_specs.outputs.count }}" -gt 0 ]; then
            FILES=$(tr '\n' ' ' < /tmp/changed-specs.txt)
            node tools/validate-front-matter.js --json --files $FILES > /tmp/frontmatter.json
            EXIT_CODE=$?
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n' '{"errors":[],"warnings":[],"info":["No spec files changed"]}' > /tmp/frontmatter.json
            EXIT_CODE=0
          else
            node tools/validate-front-matter.js --json > /tmp/frontmatter.json
            EXIT_CODE=$?
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/frontmatter.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run capability scope validator
        id: capability_scope
        continue-on-error: true
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changed_specs.outputs.count }}" -gt 0 ]; then
            FILES=$(tr '\n' ' ' < /tmp/changed-specs.txt)
            node tools/validate-capability-scope.js --json --files $FILES > /tmp/capability-scope.json
            EXIT_CODE=$?
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n' '{"errors":[],"warnings":[],"info":["No spec files changed"]}' > /tmp/capability-scope.json
            EXIT_CODE=0
          else
            node tools/validate-capability-scope.js --json > /tmp/capability-scope.json
            EXIT_CODE=$?
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/capability-scope.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run fixture schema validator
        id: fixtures
        continue-on-error: true
        run: |
          set +e
          node tools/validate-fixtures.js --json > /tmp/fixtures.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/fixtures.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run model validator
        id: models
        continue-on-error: true
        run: |
          set +e
          node tools/validate-models.js --json > /tmp/models.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/models.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run journey map validator
        id: journey_maps
        continue-on-error: true
        run: |
          set +e
          node tools/validate-journey-maps.js --json > /tmp/journey-maps.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/journey-maps.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run OpenAPI lint
        id: openapi_lint
        continue-on-error: true
        run: |
          set +e
          if [ -f specs/contracts/openapi/api.yaml ]; then
            spectral lint specs/contracts/openapi/api.yaml --ruleset .spectral.yaml > /tmp/openapi-lint.txt 2>&1
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 0 ]; then
              printf '%s\n' '{"errors":[],"warnings":[],"info":["OpenAPI lint passed"]}' > /tmp/openapi.json
            else
              node -e 'const fs=require("fs");const lines=fs.readFileSync("/tmp/openapi-lint.txt","utf8").split(/\r?\n/).filter(Boolean).slice(0,20); const out={errors:lines.length?lines:["OpenAPI lint failed"],warnings:[],info:[]}; fs.writeFileSync("/tmp/openapi.json", JSON.stringify(out));'
            fi
          else
            printf '%s\n' '{"errors":[],"warnings":[],"info":["OpenAPI spec not found, skipped"]}' > /tmp/openapi.json
            EXIT_CODE=0
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/openapi.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Gherkin lint
        id: gherkin_lint
        continue-on-error: true
        run: |
          set +e
          if [ -d specs/features ]; then
            gherkin-lint specs/features/**/*.feature > /tmp/gherkin-lint.txt 2>&1
            EXIT_CODE=$?
            if [ "$EXIT_CODE" -eq 0 ]; then
              printf '%s\n' '{"errors":[],"warnings":[],"info":["Gherkin lint passed"]}' > /tmp/gherkin.json
            else
              node -e 'const fs=require("fs");const lines=fs.readFileSync("/tmp/gherkin-lint.txt","utf8").split(/\r?\n/).filter(Boolean).slice(0,20); const out={errors:lines.length?lines:["Gherkin lint failed"],warnings:[],info:[]}; fs.writeFileSync("/tmp/gherkin.json", JSON.stringify(out));'
            fi
          else
            printf '%s\n' '{"errors":[],"warnings":[],"info":["Feature directory not found, skipped"]}' > /tmp/gherkin.json
            EXIT_CODE=0
          fi

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; let r={errors:[],warnings:[],info:[]}; try{r=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){r.errors=[`Failed to parse output: ${e.message}`];} console.log(`errors=${(r.errors||[]).length}`); console.log(`warnings=${(r.warnings||[]).length}`);' /tmp/gherkin.json >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check spec-before-code
        id: specbeforecode
        if: github.event_name == 'pull_request'
        run: |
          set +e
          IMPL_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'backend/src/' 'frontend/src/' 2>/dev/null | wc -l | tr -d ' ')
          SPEC_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'specs/' 2>/dev/null | wc -l | tr -d ' ')

          echo "impl_changes=$IMPL_CHANGES" >> "$GITHUB_OUTPUT"
          echo "spec_changes=$SPEC_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$IMPL_CHANGES" -gt "0" ] && [ "$SPEC_CHANGES" -eq "0" ]; then
            echo "warning=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'backend/src/' 'frontend/src/' > /tmp/impl-files.txt 2>/dev/null
          else
            echo "warning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function readJson(path) {
              try {
                return JSON.parse(fs.readFileSync(path, 'utf8'));
              } catch (error) {
                return { errors: [`Failed to read ${path}: ${error.message}`], warnings: [], info: [] };
              }
            }

            function summarizeLines(lines, limit = 20) {
              if (!Array.isArray(lines) || lines.length === 0) return '';
              const shown = lines.slice(0, limit).map((line) => `- ${line}`).join('\n');
              const extra = lines.length > limit ? `\n- ...and ${lines.length - limit} more` : '';
              return `${shown}${extra}`;
            }

            const checks = [
              { name: 'Traceability', path: '/tmp/traceability.json', exitCode: Number('${{ steps.traceability.outputs.exit_code }}') || 0 },
              { name: 'Front-Matter', path: '/tmp/frontmatter.json', exitCode: Number('${{ steps.frontmatter.outputs.exit_code }}') || 0 },
              { name: 'Capability Scope', path: '/tmp/capability-scope.json', exitCode: Number('${{ steps.capability_scope.outputs.exit_code }}') || 0 },
              { name: 'Fixtures', path: '/tmp/fixtures.json', exitCode: Number('${{ steps.fixtures.outputs.exit_code }}') || 0 },
              { name: 'Models', path: '/tmp/models.json', exitCode: Number('${{ steps.models.outputs.exit_code }}') || 0 },
              { name: 'Journey Maps', path: '/tmp/journey-maps.json', exitCode: Number('${{ steps.journey_maps.outputs.exit_code }}') || 0 },
              { name: 'OpenAPI Lint', path: '/tmp/openapi.json', exitCode: Number('${{ steps.openapi_lint.outputs.exit_code }}') || 0 },
              { name: 'Gherkin Lint', path: '/tmp/gherkin.json', exitCode: Number('${{ steps.gherkin_lint.outputs.exit_code }}') || 0 },
            ];

            let body = '## IDD Compliance Review\n\n';
            let totalErrors = 0;
            let totalWarnings = 0;

            for (const check of checks) {
              const data = readJson(check.path);
              const errors = Array.isArray(data.errors) ? data.errors : [];
              const warnings = Array.isArray(data.warnings) ? data.warnings : [];
              const info = Array.isArray(data.info) ? data.info : [];

              totalErrors += errors.length;
              totalWarnings += warnings.length;

              const icon = check.exitCode === 0 ? '✅' : '❌';
              body += `### ${check.name} ${icon}\n`;
              body += `- Errors: ${errors.length}\n`;
              body += `- Warnings: ${warnings.length}\n`;

              const details = [];
              const errText = summarizeLines(errors, 20);
              if (errText) {
                details.push('**Errors**');
                details.push(errText);
              }

              const warnText = summarizeLines(warnings, 20);
              if (warnText) {
                details.push('**Warnings**');
                details.push(warnText);
              }

              const infoText = summarizeLines(info, 10);
              if (infoText) {
                details.push('**Info**');
                details.push(infoText);
              }

              if (details.length > 0) {
                body += '\n<details><summary>Details</summary>\n\n';
                body += `${details.join('\n\n')}\n`;
                body += '\n</details>\n';
              }

              body += '\n';
            }

            const implChanges = Number('${{ steps.specbeforecode.outputs.impl_changes }}') || 0;
            const specChanges = Number('${{ steps.specbeforecode.outputs.spec_changes }}') || 0;
            const specWarning = '${{ steps.specbeforecode.outputs.warning }}' === 'true';

            if (specWarning) {
              body += '### Spec-Before-Code ⚠️\n';
              body += `- ${implChanges} implementation file(s) changed without spec updates\n`;
              body += '- If behavior changed, update specs first.\n';
              try {
                const files = fs.readFileSync('/tmp/impl-files.txt', 'utf8').trim();
                if (files) {
                  body += '\n<details><summary>Changed implementation files</summary>\n\n';
                  body += `\n\`\`\`\n${files}\n\`\`\`\n`;
                  body += '\n</details>\n';
                }
              } catch (_) {
                // Ignore.
              }
              body += '\n';
            } else if (implChanges > 0) {
              body += '### Spec-Before-Code ✅\n';
              body += `- ${implChanges} implementation file(s) with ${specChanges} spec file(s) updated\n\n`;
            }

            body += '---\n';
            body += `Total errors: ${totalErrors}  \\nTotal warnings: ${totalWarnings}\n`;
            body += '\n*Automated by IDD validation workflow.*\n';

            const marker = '## IDD Compliance Review';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce failure status
        if: always()
        run: |
          FAIL_COUNT=0
          [ "${{ steps.traceability.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.frontmatter.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.capability_scope.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.fixtures.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.models.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.journey_maps.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.openapi_lint.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))
          [ "${{ steps.gherkin_lint.outputs.exit_code }}" != "0" ] && FAIL_COUNT=$((FAIL_COUNT+1))

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "Validation failed in $FAIL_COUNT check(s)."
            exit 1
          fi

          echo "All validation checks passed."
