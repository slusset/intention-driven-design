name: 'IDD Compliance Check'
description: 'Run Intention-Driven Design validators against a specs/ directory and post results.'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  specs-dir:
    description: 'Path to specs directory (relative to repo root)'
    required: false
    default: 'specs'
  checks:
    description: 'Space-separated list of checks to run, or "all"'
    required: false
    default: 'all'
  post-comment:
    description: 'Post a PR comment with results (only on pull_request events)'
    required: false
    default: 'true'
  spectral-ruleset:
    description: 'Path to Spectral ruleset for OpenAPI linting'
    required: false
    default: '.spectral.yaml'
  gherkin-config:
    description: 'Path to gherkin-lint config'
    required: false
    default: '.gherkin-lintrc'

outputs:
  total-errors:
    description: 'Total number of errors found'
    value: ${{ steps.summarize.outputs.total_errors }}
  total-warnings:
    description: 'Total number of warnings found'
    value: ${{ steps.summarize.outputs.total_warnings }}
  passed:
    description: 'Whether all checks passed'
    value: ${{ steps.summarize.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install idd-toolkit
      shell: bash
      run: |
        # If running from within the idd repo itself, use local install
        if [ -f "${{ github.action_path }}/../../../package.json" ]; then
          cd "${{ github.action_path }}/../../.."
          npm ci
        else
          npm install idd-toolkit
        fi

    - name: Gather changed specs
      id: changed_specs
      shell: bash
      run: |
        set +e
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '${{ inputs.specs-dir }}/**' > /tmp/changed-specs.txt
          COUNT=$(grep -c . /tmp/changed-specs.txt || true)
        else
          : > /tmp/changed-specs.txt
          COUNT=0
        fi
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"

    - name: Run IDD validators
      id: validate
      shell: bash
      run: |
        set +e

        # Resolve the idd CLI
        if [ -f "${{ github.action_path }}/../../../bin/idd.js" ]; then
          IDD="node ${{ github.action_path }}/../../../bin/idd.js"
        else
          IDD="npx idd"
        fi

        CHECKS="${{ inputs.checks }}"
        SPECS_DIR="${{ inputs.specs-dir }}"

        # Run core validators
        $IDD validate $CHECKS --json > /tmp/idd-validate.json 2>&1
        CORE_EXIT=$?
        echo "core_exit=$CORE_EXIT" >> "$GITHUB_OUTPUT"

        # Run OpenAPI lint if ruleset and spec exist
        OPENAPI_EXIT=0
        if [ -f "${{ inputs.spectral-ruleset }}" ] && [ -f "$SPECS_DIR/contracts/openapi/api.yaml" ]; then
          npx spectral lint "$SPECS_DIR/contracts/openapi/api.yaml" --ruleset "${{ inputs.spectral-ruleset }}" > /tmp/openapi-lint.txt 2>&1
          OPENAPI_EXIT=$?
        fi
        echo "openapi_exit=$OPENAPI_EXIT" >> "$GITHUB_OUTPUT"

        # Run Gherkin lint if config and features exist
        GHERKIN_EXIT=0
        if [ -f "${{ inputs.gherkin-config }}" ] && [ -d "$SPECS_DIR/features" ]; then
          npx gherkin-lint -c "${{ inputs.gherkin-config }}" "$SPECS_DIR/features/**/*.feature" > /tmp/gherkin-lint.txt 2>&1
          GHERKIN_EXIT=$?
        fi
        echo "gherkin_exit=$GHERKIN_EXIT" >> "$GITHUB_OUTPUT"

        # Spec-before-code check
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          IMPL_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'backend/src/' 'frontend/src/' 2>/dev/null | wc -l | tr -d ' ')
          SPEC_CHANGES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- "$SPECS_DIR/" 2>/dev/null | wc -l | tr -d ' ')
          echo "impl_changes=$IMPL_CHANGES" >> "$GITHUB_OUTPUT"
          echo "spec_changes=$SPEC_CHANGES" >> "$GITHUB_OUTPUT"
          if [ "$IMPL_CHANGES" -gt "0" ] && [ "$SPEC_CHANGES" -eq "0" ]; then
            echo "spec_warning=true" >> "$GITHUB_OUTPUT"
          else
            echo "spec_warning=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "impl_changes=0" >> "$GITHUB_OUTPUT"
          echo "spec_changes=0" >> "$GITHUB_OUTPUT"
          echo "spec_warning=false" >> "$GITHUB_OUTPUT"
        fi

        exit 0

    - name: Build summary
      id: summarize
      shell: bash
      run: |
        node <<'NODE'
        const fs = require('fs');

        let coreOutput = '';
        try { coreOutput = fs.readFileSync('/tmp/idd-validate.json', 'utf8'); } catch (_) {}

        let openapiLines = [];
        try { openapiLines = fs.readFileSync('/tmp/openapi-lint.txt', 'utf8').split(/\r?\n/).filter(Boolean); } catch (_) {}

        let gherkinLines = [];
        try { gherkinLines = fs.readFileSync('/tmp/gherkin-lint.txt', 'utf8').split(/\r?\n/).filter(Boolean); } catch (_) {}

        const coreExit = Number('${{ steps.validate.outputs.core_exit }}' || 0);
        const openapiExit = Number('${{ steps.validate.outputs.openapi_exit }}' || 0);
        const gherkinExit = Number('${{ steps.validate.outputs.gherkin_exit }}' || 0);
        const specWarning = '${{ steps.validate.outputs.spec_warning }}' === 'true';
        const implChanges = Number('${{ steps.validate.outputs.impl_changes }}' || 0);
        const specChanges = Number('${{ steps.validate.outputs.spec_changes }}' || 0);

        let body = '## IDD Compliance Review\n\n';

        // Core validators output
        body += `### Core Validators ${coreExit === 0 ? '✅' : '❌'}\n\n`;
        body += '```\n' + (coreOutput || 'No output') + '\n```\n\n';

        // OpenAPI
        if (openapiLines.length > 0 || openapiExit !== 0) {
          body += `### OpenAPI Lint ${openapiExit === 0 ? '✅' : '❌'}\n\n`;
          if (openapiLines.length > 0) {
            body += '<details><summary>Details</summary>\n\n```\n' + openapiLines.slice(0, 20).join('\n') + '\n```\n\n</details>\n\n';
          }
        }

        // Gherkin
        if (gherkinLines.length > 0 || gherkinExit !== 0) {
          body += `### Gherkin Lint ${gherkinExit === 0 ? '✅' : '❌'}\n\n`;
          if (gherkinLines.length > 0) {
            body += '<details><summary>Details</summary>\n\n```\n' + gherkinLines.slice(0, 20).join('\n') + '\n```\n\n</details>\n\n';
          }
        }

        // Spec-before-code
        if (specWarning) {
          body += `### Spec-Before-Code ⚠️\n`;
          body += `- ${implChanges} implementation file(s) changed without spec updates\n`;
          body += '- If behavior changed, update specs first.\n\n';
        } else if (implChanges > 0) {
          body += `### Spec-Before-Code ✅\n`;
          body += `- ${implChanges} implementation file(s) with ${specChanges} spec file(s) updated\n\n`;
        }

        body += '---\n*Automated by [IDD Toolkit](https://github.com/slusset/intention-driven-design)*\n';

        const totalErrors = coreExit + openapiExit + gherkinExit;
        const passed = totalErrors === 0 ? 'true' : 'false';

        fs.writeFileSync('/tmp/idd-summary.md', body);

        // Write outputs
        const outputFile = process.env.GITHUB_OUTPUT || '/dev/null';
        fs.appendFileSync(outputFile, `total_errors=${totalErrors}\n`);
        fs.appendFileSync(outputFile, `total_warnings=0\n`);
        fs.appendFileSync(outputFile, `passed=${passed}\n`);
        NODE

        cat /tmp/idd-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.post-comment == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body;
          try {
            body = fs.readFileSync('/tmp/idd-summary.md', 'utf8');
          } catch (error) {
            body = `## IDD Compliance Review\n\n- Failed to load summary: ${error.message}\n`;
          }

          const marker = '## IDD Compliance Review';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Enforce failure
      if: always()
      shell: bash
      run: |
        CORE_EXIT="${{ steps.validate.outputs.core_exit }}"
        OPENAPI_EXIT="${{ steps.validate.outputs.openapi_exit }}"
        GHERKIN_EXIT="${{ steps.validate.outputs.gherkin_exit }}"

        if [ "$CORE_EXIT" != "0" ] || [ "$OPENAPI_EXIT" != "0" ] || [ "$GHERKIN_EXIT" != "0" ]; then
          echo "IDD validation failed."
          exit 1
        fi
        echo "All IDD checks passed."
